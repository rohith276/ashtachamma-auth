<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashta Chamma Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #120820; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #3d1e66; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
            border: 2px solid #5a2d99;
            width: 80%;
            max-width: 400px;
        }
        h2 { 
            margin-top: 0; 
            color: #fef08a; 
            font-size: 24px;
        }
        p {
            font-size: 16px;
            color: #d1c4e9;
            margin-bottom: 30px;
        }
        a { 
            display: inline-block;
            background: #1db954; 
            color: white; 
            text-decoration: none;
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 8px; 
            box-shadow: 0 4px 0 #148039; 
            transition: transform 0.1s;
        }
        a:active { 
            transform: translateY(4px); 
            box-shadow: 0 0 0 #148039; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Auth Successful!</h2>
        <p>Google Sign-In is complete. Tap the button below to return to the game.</p>
        <a id="return-btn" href="#">Return to Game</a>
    </div>
    
    <script>
        // Grab the full URL fragment (which contains the Supabase access_token)
        var hash = window.location.hash;
        
        // Dynamically set the deep link URL with the token!
        var btn = document.getElementById('return-btn');
        btn.href = "ashtachamma://login" + hash;
        
        // Optional: Close the window if the browser allows it after clicking
        btn.onclick = function() {
            setTimeout(function() {
                window.close();
            }, 1000);
        };
    </script>
</body>
</html>
