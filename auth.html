<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashta Chamma Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #120820; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #3d1e66; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
            border: 2px solid #5a2d99;
            width: 80%;
            max-width: 400px;
        }
        h2 { 
            margin-top: 0; 
            color: #fef08a; 
            font-size: 24px;
        }
        p {
            font-size: 16px;
            color: #d1c4e9;
            margin-bottom: 30px;
        }
        .error-msg {
            font-size: 14px;
            color: #ef5350;
            margin-bottom: 20px;
            display: none;
        }
        a { 
            display: inline-block;
            background: #1db954; 
            color: white; 
            text-decoration: none;
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 8px; 
            box-shadow: 0 4px 0 #148039; 
            transition: transform 0.1s;
        }
        a:active { 
            transform: translateY(4px); 
            box-shadow: 0 0 0 #148039; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Auth Successful!</h2>
        <p id="message">Google Sign-In is complete. Tap the button below to return to the game.</p>
        <p class="error-msg" id="error-msg"></p>
        <a id="return-btn" href="ashtachamma://login">Return to Game</a>
    </div>
    
    <script>
        var hash = window.location.hash;
        var titleEl = document.getElementById('title');
        var msgEl = document.getElementById('message');
        var errorEl = document.getElementById('error-msg');
        var btn = document.getElementById('return-btn');
        var fullUrl = window.location.href;
        
        // Check if there's an error in the URL
        if (fullUrl.indexOf('error=') !== -1 || fullUrl.indexOf('error_code=') !== -1) {
            titleEl.textContent = 'Auth Failed';
            titleEl.style.color = '#ef5350';
            var match = fullUrl.match(/error_description=([^&#]+)/);
            if (match) {
                errorEl.textContent = decodeURIComponent(match[1].replace(/\+/g, ' '));
                errorEl.style.display = 'block';
            }
            msgEl.textContent = 'Something went wrong. Tap below to return and try again.';
            btn.href = "ashtachamma://login?error=auth_failed";
        } else if (hash && hash.indexOf('access_token') !== -1) {
            // SUCCESS! Tokens are in the hash fragment.
            // Convert them to query params so Android can read them from intent.getData()
            var tokenData = hash.substring(1); // remove leading #
            btn.href = "ashtachamma://login?" + tokenData;
        } else {
            titleEl.textContent = 'Waiting...';
            msgEl.textContent = 'No authentication data received. Tap below to return.';
        }
    </script>
</body>
</html>
